<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — CampusFind</title>
</head>
<body>
  <main>
    <h1>Log in to CampusFind</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>
    <p>New to CampusFind? <a href="{% url 'register' %}">Create an account</a>.</p>
    <p><a href="{% url 'home' %}">Back to home</a></p>
  </main>
</body>
</html>
